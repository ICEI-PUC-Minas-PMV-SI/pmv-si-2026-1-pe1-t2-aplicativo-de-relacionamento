<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configurações | MatchConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/App.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-match">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="../home/Homeusuario.html">
                    <i class="bi bi-heart-pulse-fill"></i> MatchConnect
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3 text-center">
                        <li class="nav-item"><a class="nav-link" href="../home/Homeusuario.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Perfil/Perfil.html">Perfil</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Seguranca/Seguranca.html">Segurança</a></li>
                        <li class="nav-item"><a class="nav-link active" href="Configuracoes.html">Configurações</a></li>
                        <li class="nav-item"><button id="btnSair" class="btn btn-entrar">Sair</button></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        <div class="container">
            <section class="page-heading">
                <div>
                    <span class="section-kicker">Conta</span>
                    <h1>Configurações</h1>
                    <p>Gerencie preferências básicas da sua conta e da experiência no MatchConnect.</p>
                </div>
            </section>

            <div class="row g-4">
                <div class="col-lg-6">
                    <form id="formConfiguracoes" class="app-panel">
                        <h2 class="h4 fw-bold mb-3">Preferências</h2>
                        <div class="form-check form-switch mb-3">
                            <input id="notificacoes" class="form-check-input" type="checkbox">
                            <label class="form-check-label" for="notificacoes">Receber notificações de novos matches</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input id="perfilVisivel" class="form-check-input" type="checkbox">
                            <label class="form-check-label" for="perfilVisivel">Perfil visível na descoberta</label>
                        </div>
                        <label for="tomConversa" class="form-label">Tom das sugestões do Cupido</label>
                        <select id="tomConversa" class="form-select mb-4">
                            <option>Leve e divertido</option>
                            <option>Direto e educado</option>
                            <option>Romântico</option>
                            <option>Amigável</option>
                        </select>
                        <button class="btn btn-match-primary" type="submit">Salvar preferências</button>
                        <p id="mensagemConfig" class="status-message mt-3"></p>
                    </form>
                </div>
                <div class="col-lg-6">
                    <section class="app-panel">
                        <h2 class="h4 fw-bold mb-3">Área da conta</h2>
                        <a class="btn btn-match-outline w-100 mb-2" href="../EditarPerfil/EditarPerfil.html">Editar dados pessoais</a>
                        <a class="btn btn-match-outline w-100 mb-2" href="../Termos/Termos.html">Termos e privacidade</a>
                        <button id="btnLimparSessao" class="btn btn-outline-danger w-100" type="button">Encerrar sessão</button>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/appData.js"></script>
    <script src="Configuracoes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
