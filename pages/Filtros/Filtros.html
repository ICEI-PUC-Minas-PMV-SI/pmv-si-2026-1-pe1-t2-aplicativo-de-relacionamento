<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Filtros | MatchConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/App.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-match">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="../home/Homeusuario.html">
                    <i class="bi bi-heart-pulse-fill"></i> MatchConnect
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3 text-center">
                        <li class="nav-item"><a class="nav-link" href="../home/Homeusuario.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Matches/Matches.html">Matches</a></li>
                        <li class="nav-item"><a class="nav-link active" href="Filtros.html">Filtros</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Eventos/Eventos.html">Eventos</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Cupido/Cupido.html">Cupido</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Configuracoes/Configuracoes.html">Configurações</a></li>
                        <li class="nav-item"><button id="btnSair" class="btn btn-entrar">Sair</button></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        <div class="container">
            <section class="page-heading">
                <div>
                    <span class="section-kicker">Descoberta</span>
                    <h1>Filtros de compatibilidade</h1>
                    <p>Simule preferências para refinar os perfis exibidos na descoberta.</p>
                </div>
                <a class="btn btn-match-outline" href="../home/Homeusuario.html#descobrir">Voltar à descoberta</a>
            </section>

            <div class="row g-4">
                <div class="col-lg-4">
                    <form id="formFiltros" class="app-panel">
                        <div class="mb-3">
                            <label for="idadeMinima" class="form-label">Idade mínima</label>
                            <input id="idadeMinima" class="form-control" type="number" min="18" value="18">
                        </div>
                        <div class="mb-3">
                            <label for="idadeMaxima" class="form-label">Idade máxima</label>
                            <input id="idadeMaxima" class="form-control" type="number" min="18" value="35">
                        </div>
                        <div class="mb-3">
                            <label for="interesseFiltro" class="form-label">Interesse principal</label>
                            <input id="interesseFiltro" class="form-control" type="text" placeholder="Cinema, Música, Games">
                        </div>
                        <div class="mb-4">
                            <label for="objetivoFiltro" class="form-label">Objetivo</label>
                            <select id="objetivoFiltro" class="form-select">
                                <option value="">Qualquer objetivo</option>
                                <option>Relacionamento sério</option>
                                <option>Conhecer pessoas novas</option>
                                <option>Amizade</option>
                                <option>Algo leve, sem pressão</option>
                            </select>
                        </div>
                        <button class="btn btn-match-primary w-100" type="submit">Aplicar filtros</button>
                        <button id="btnLimparFiltros" class="btn btn-match-outline w-100 mt-2" type="button">Limpar</button>
                    </form>
                </div>

                <div class="col-lg-8">
                    <section class="app-panel">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h4 fw-bold mb-0">Resultados</h2>
                            <span id="totalResultados" class="text-muted"></span>
                        </div>
                        <div id="resultadosFiltros"></div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script src="../../assets/js/navigation.js"></script>
    <script src="../../assets/js/appData.js"></script>
    <script src="Filtros.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
