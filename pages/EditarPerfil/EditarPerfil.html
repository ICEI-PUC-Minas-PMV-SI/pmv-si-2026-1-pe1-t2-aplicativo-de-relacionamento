<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Perfil | MatchConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/App.css">
    <link rel="stylesheet" href="../../assets/css/Internal.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-match">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="../home/Homeusuario.html">
                    <i class="bi bi-heart-pulse-fill"></i> MatchConnect
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3 text-center">
                        <li class="nav-item"><a class="nav-link" href="../home/Homeusuario.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Perfil/Perfil.html">Perfil</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Matches/Matches.html">Matches</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Conversas/Conversas.html">Conversas</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Quiz/Quiz.html">Quiz</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Configuracoes/Configuracoes.html">Configurações</a></li>
                        <li class="nav-item"><button id="btnSair" class="btn btn-entrar">Sair</button></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        <div class="container">
            <section class="page-heading">
                <div>
                    <span class="section-kicker">Editar perfil</span>
                    <h1>Atualize suas informações</h1>
                    <p>Esses dados alimentam sua compatibilidade, suas sugestões e a forma como seu perfil aparece.</p>
                </div>
                <a class="btn btn-match-outline" href="../Quiz/Quiz.html">Atualizar personalidade</a>
            </section>

            <form id="formEditarPerfil" class="app-panel">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome completo</label>
                        <input id="nome" class="form-control" type="text">
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">E-mail</label>
                        <input id="email" class="form-control" type="email">
                    </div>
                    <div class="col-md-4">
                        <label for="objetivo" class="form-label">O que você busca?</label>
                        <select id="objetivo" class="form-select">
                            <option value="">Selecione</option>
                            <option>Relacionamento sério</option>
                            <option>Conhecer pessoas novas</option>
                            <option>Amizade</option>
                            <option>Algo leve, sem pressão</option>
                            <option>Ainda não sei</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="personalidade" class="form-label">Personalidade</label>
                        <select id="personalidade" class="form-select">
                            <option value="">Selecione</option>
                            <option>Mais extrovertido(a)</option>
                            <option>Mais introvertido(a)</option>
                            <option>Um equilíbrio dos dois</option>
                            <option>Depende do ambiente</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="programaIdeal" class="form-label">Programa ideal</label>
                        <select id="programaIdeal" class="form-select">
                            <option value="">Selecione</option>
                            <option>Jantar ou café tranquilo</option>
                            <option>Cinema, show ou teatro</option>
                            <option>Praia, trilha ou ar livre</option>
                            <option>Festa ou barzinho</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea id="descricao" class="form-control" rows="4"></textarea>
                    </div>
                    <div class="col-12">
                        <label for="interesses" class="form-label">Interesses separados por vírgula</label>
                        <input id="interesses" class="form-control" type="text" placeholder="Cinema, Música, Viagens">
                    </div>
                    <div class="col-md-6">
                        <label for="gostaMuito" class="form-label">Gosto muito</label>
                        <input id="gostaMuito" class="form-control" type="text" placeholder="Cinema, Livros">
                    </div>
                    <div class="col-md-6">
                        <label for="queroExplorar" class="form-label">Quero explorar</label>
                        <input id="queroExplorar" class="form-control" type="text" placeholder="Gastronomia, Corrida">
                    </div>
                    <div class="col-md-6">
                        <label for="naoCurto" class="form-label">Não curto</label>
                        <input id="naoCurto" class="form-control" type="text" placeholder="Balada, Trilhas longas">
                    </div>
                    <div class="col-md-6">
                        <label for="assuntoFavorito" class="form-label">Meu assunto favorito</label>
                        <input id="assuntoFavorito" class="form-control" type="text" placeholder="filmes de suspense">
                    </div>
                </div>

                <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
                    <button class="btn btn-match-primary" type="submit">Salvar alterações</button>
                    <a class="btn btn-match-outline" href="../CadastroInteresses/cadastrointeresses.html">Editar fotos</a>
                    <span id="mensagemEditar" class="status-message"></span>
                </div>
            </form>
        </div>
    </main>

    <script src="../../assets/js/navigation.js"></script>
    <script src="../../assets/js/appData.js"></script>
    <script src="EditarPerfil.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
