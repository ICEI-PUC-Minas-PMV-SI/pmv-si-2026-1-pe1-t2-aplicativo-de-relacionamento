<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administração | MatchConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/App.css">
    <link rel="stylesheet" href="../../assets/css/Internal.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-match">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="AdminDashboard.html">
                    <i class="bi bi-shield-lock-fill"></i> MatchConnect Admin
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3 text-center">
                        <li class="nav-item"><a class="nav-link active" href="AdminDashboard.html">Painel</a></li>
                        <li class="nav-item"><a class="nav-link" href="AdminUsuarios.html">Usuários</a></li>
                        <li class="nav-item"><a class="nav-link" href="AdminDenuncias.html">Denúncias</a></li>
                        <li class="nav-item"><button id="btnSair" class="btn btn-entrar">Sair</button></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        <div class="container">
            <section class="page-heading">
                <div class="page-heading-main">
                    <span class="page-heading-icon"><i class="bi bi-bar-chart-line-fill"></i></span>
                    <div>
                        <span class="section-kicker">Administração</span>
                        <h1>Painel de controle</h1>
                        <p>Visão geral do sistema, métricas e avisos para a administração da plataforma.</p>
                    </div>
                </div>
            </section>

            <div class="row g-4">
                <div class="col-md-6 col-xl-3">
                    <section class="app-panel p-4">
                        <span class="text-muted">Total de contas</span>
                        <h2 id="totalUsuarios" class="mt-3">0</h2>
                    </section>
                </div>
                <div class="col-md-6 col-xl-3">
                    <section class="app-panel p-4">
                        <span class="text-muted">Usuários ativos</span>
                        <h2 id="usuariosAtivos" class="mt-3">0</h2>
                    </section>
                </div>
                <div class="col-md-6 col-xl-3">
                    <section class="app-panel p-4">
                        <span class="text-muted">Denúncias pendentes</span>
                        <h2 id="denunciasPendentes" class="mt-3">0</h2>
                    </section>
                </div>
                <div class="col-md-6 col-xl-3">
                    <section class="app-panel p-4">
                        <span class="text-muted">Novos usuários (7d)</span>
                        <h2 id="novosUsuarios" class="mt-3">0</h2>
                    </section>
                </div>
            </div>

            <div class="row g-4 mt-3">
                <div class="col-12">
                    <section class="app-panel p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <span class="section-kicker">Monitoramento</span>
                                <h2 class="h4 fw-bold">Últimas denúncias</h2>
                            </div>
                        </div>
                        <div id="listaDenuncias" class="list-group"></div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script src="../../assets/js/navigation.js"></script>
    <script src="../../assets/js/appData.js"></script>
    <script src="AdminDashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
