<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Controle de Usuários | MatchConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/App.css">
    <link rel="stylesheet" href="../../assets/css/Internal.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-match">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="AdminDashboard.html">
                    <i class="bi bi-shield-lock-fill"></i> MatchConnect Admin
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3 text-center">
                        <li class="nav-item"><a class="nav-link" href="AdminDashboard.html">Painel</a></li>
                        <li class="nav-item"><a class="nav-link active" href="AdminUsuarios.html">Usuários</a></li>
                        <li class="nav-item"><a class="nav-link" href="AdminDenuncias.html">Denúncias</a></li>
                        <li class="nav-item"><button id="btnSair" class="btn btn-entrar">Sair</button></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        <div class="container">
            <section class="page-heading">
                <div>
                    <span class="section-kicker">Administração</span>
                    <h1>Controle de usuários</h1>
                    <p>Gerencie contas cadastradas, bloqueie usuários e valide perfis.</p>
                </div>
            </section>

            <section class="app-panel p-4">
                <div class="row align-items-center mb-4">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input id="buscaUsuarios" class="form-control" type="search" placeholder="Buscar por nome, e-mail ou papel">
                        </div>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-borderless align-middle">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Criação</th>
                                <th>Status</th>
                                <th>Verificado</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabelaUsuarios"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script src="../../assets/js/navigation.js"></script>
    <script src="../../assets/js/appData.js"></script>
    <script src="AdminUsuarios.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
