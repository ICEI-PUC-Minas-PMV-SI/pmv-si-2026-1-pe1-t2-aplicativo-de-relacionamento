<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Onboarding | MatchConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/App.css">
    <link rel="stylesheet" href="../../assets/css/Internal.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-match">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="../home/Homeusuario.html">
                    <i class="bi bi-heart-pulse-fill"></i> MatchConnect
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3 text-center">
                        <li class="nav-item"><a class="nav-link" href="../home/Homeusuario.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link active" href="Onboarding.html">Preferências</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Filtros/Filtros.html">Filtros</a></li>
                        <li class="nav-item"><button id="btnSair" class="btn btn-entrar">Sair</button></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        <div class="container">
            <section class="page-heading">
                <div>
                    <span class="section-kicker">Comece melhor</span>
                    <h1>Preferências de descoberta</h1>
                    <p>Ajuste o que o MatchConnect deve priorizar ao sugerir pessoas, eventos e experiências.</p>
                </div>
                <a class="btn btn-match-outline" href="../home/Homeusuario.html#descobrir">Ir para descoberta</a>
            </section>

            <form id="formOnboarding" class="app-panel filter-panel">
                <div class="filter-inline-grid">
                    <div>
                        <label for="idadeMinOnboarding" class="form-label">Idade mínima</label>
                        <input id="idadeMinOnboarding" class="form-control" type="number" min="18" value="18">
                    </div>
                    <div>
                        <label for="idadeMaxOnboarding" class="form-label">Idade máxima</label>
                        <input id="idadeMaxOnboarding" class="form-control" type="number" min="18" value="35">
                    </div>
                </div>

                <div class="filter-control">
                    <label for="distanciaOnboarding" class="form-label">Distância máxima</label>
                    <input id="distanciaOnboarding" class="form-range match-range" type="range" min="1" max="100" value="30">
                    <strong id="distanciaOnboardingResumo">Até 30 km</strong>
                </div>

                <div class="filter-inline-grid">
                    <div>
                        <label for="objetivoOnboarding" class="form-label">Objetivo</label>
                        <select id="objetivoOnboarding" class="form-select">
                            <option value="">Qualquer objetivo</option>
                            <option>Relacionamento sério</option>
                            <option>Conhecer pessoas novas</option>
                            <option>Amizade</option>
                            <option>Algo leve, sem pressão</option>
                        </select>
                    </div>
                    <div>
                        <label for="estiloOnboarding" class="form-label">Estilo de encontro</label>
                        <select id="estiloOnboarding" class="form-select">
                            <option>Café curto</option>
                            <option>Evento cultural</option>
                            <option>Chamada online primeiro</option>
                            <option>Passeio ao ar livre</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="interesseOnboarding" class="form-label">Interesse para priorizar</label>
                    <input id="interesseOnboarding" class="form-control" type="text" placeholder="Música, Livros, Cinema">
                </div>

                <div class="filter-actions">
                    <button class="btn btn-match-primary" type="submit">Salvar preferências</button>
                    <a class="btn btn-match-outline" href="../Filtros/Filtros.html">Abrir filtros</a>
                </div>
                <p id="statusOnboarding" class="status-message mb-0"></p>
            </form>
        </div>
    </main>

    <script src="../../assets/js/navigation.js"></script>
    <script src="../../assets/js/appData.js"></script>
    <script src="Onboarding.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
