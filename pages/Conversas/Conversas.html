<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conversas | MatchConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/App.css">
    <link rel="stylesheet" href="../../assets/css/Internal.css">
<link rel="stylesheet" href="../../assets/css/dark-mode.css">
<script>!function(){var t=localStorage.getItem("matchConnectTheme");t&&document.documentElement.setAttribute("data-theme",t)}();</script></head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-match">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="../home/Homeusuario.html">
                    <i class="bi bi-heart-pulse-fill"></i> MatchConnect
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3 text-center">
                        <li class="nav-item"><a class="nav-link" href="../home/Homeusuario.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Perfil/Perfil.html">Perfil</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Matches/Matches.html">Matches</a></li>
                        <li class="nav-item"><a class="nav-link" href="../CentralMatch/CentralMatch.html">Central</a></li>
                        <li class="nav-item"><a class="nav-link active" href="Conversas.html">Conversas</a></li>
                        <li class="nav-item"><a class="nav-link" href="../EROS/EROS.html">EROS</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Eventos/Eventos.html">Eventos</a></li>
                        <li class="nav-item"><button id="btnSair" class="btn btn-entrar">Sair</button></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        <div class="container">
            <section class="page-heading">
                <div class="page-heading-main">
                    <span class="page-heading-icon"><i class="bi bi-chat-heart"></i></span>
                    <div>
                        <span class="section-kicker">Mensagens</span>
                        <h1>Conversas</h1>
                        <p>Use sugestões baseadas em afinidade para começar conversas de um jeito mais natural.</p>
                    </div>
                </div>
                <div class="page-actions">
                    <a class="btn btn-match-outline" href="../EROS/EROS.html">Abrir EROS</a>
                    <a class="btn btn-match-outline" href="../Matches/Matches.html">Ver matches</a>
                </div>
            </section>

            <div class="row g-4 chat-shell">
                <div class="col-lg-4">
                    <section class="visual-panel chat-list-panel">
                        <label for="buscaConversas" class="form-label">Buscar conversa</label>
                        <input id="buscaConversas" class="form-control mb-3" type="search" placeholder="Nome ou interesse">
                        <div id="listaConversas"></div>
                    </section>
                </div>

                <div class="col-lg-8">
                    <section class="visual-panel chat-main-panel">
                        <div id="chatCabecalho" class="d-flex align-items-center gap-3 mb-4"></div>
                        <div id="alertaConversa" class="alert alert-warning d-none" role="status"></div>
                        <div id="chatMensagens" class="mb-4"></div>

                        <div id="chatQuickActions" class="chat-quick-actions d-flex flex-wrap gap-2 mb-3">
                            <button id="btnUsarSugestao" class="btn btn-match-outline btn-sm" type="button">
                                <i class="bi bi-robot"></i> EROS
                            </button>
                            <button class="btn btn-match-outline btn-sm acao-chat" type="button" data-acao="evento">Sugerir evento</button>
                            <button class="btn btn-match-outline btn-sm acao-chat" type="button" data-acao="experiencia">Enviar experiência</button>
                            <button id="btnLigarChat" class="btn btn-match-primary btn-sm" type="button">
                                <i class="bi bi-telephone"></i> Ligar
                            </button>
                            <button id="btnEncerrarConversa" class="btn btn-match-outline btn-sm" type="button">Encerrar conversa</button>
                            <button class="btn btn-match-outline btn-sm acao-chat" type="button" data-acao="denuncia">Denunciar</button>
                            <button class="btn btn-match-outline btn-sm acao-chat" type="button" data-acao="bloquear">Bloquear</button>
                        </div>

                        <div id="painelEROSChat" class="chat-eros-popover d-none" aria-live="polite">
                            <div class="chat-eros-popover-head">
                                <span class="section-kicker">EROS</span>
                                <button id="btnFecharEROSChat" class="icon-action" type="button" aria-label="Fechar EROS">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                            <div id="sugestaoEROS"></div>
                        </div>

                        <form id="formMensagem" class="d-grid gap-2">
                            <div class="d-flex gap-2">
                                <input id="campoMensagem" class="form-control" type="text" placeholder="Digite uma mensagem">
                                <button class="btn btn-match-primary" type="submit"><i class="bi bi-send"></i></button>
                            </div>
                        </form>
                        <p id="statusChat" class="status-message mt-3 mb-0"></p>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script src="../../assets/js/navigation.js"></script>
    <script src="../../assets/js/appData.js"></script>
    <script src="Conversas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/theme.js"></script>
</body>

</html>
