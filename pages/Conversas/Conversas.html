<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conversas | MatchConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/App.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-match">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="../home/Homeusuario.html">
                    <i class="bi bi-heart-pulse-fill"></i> MatchConnect
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3 text-center">
                        <li class="nav-item"><a class="nav-link" href="../home/Homeusuario.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Perfil/Perfil.html">Perfil</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Matches/Matches.html">Matches</a></li>
                        <li class="nav-item"><a class="nav-link active" href="Conversas.html">Conversas</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Cupido/Cupido.html">Cupido</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Eventos/Eventos.html">Eventos</a></li>
                        <li class="nav-item"><button id="btnSair" class="btn btn-entrar">Sair</button></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        <div class="container">
            <section class="page-heading">
                <div>
                    <span class="section-kicker">Mensagens</span>
                    <h1>Conversas</h1>
                    <p>Use sugestões baseadas em afinidade para começar conversas de um jeito mais natural.</p>
                </div>
                <div class="page-actions">
                    <a class="btn btn-match-outline" href="../Cupido/Cupido.html">Abrir Cupido</a>
                    <a class="btn btn-match-outline" href="../Matches/Matches.html">Ver matches</a>
                </div>
            </section>

            <div class="row g-4">
                <div class="col-lg-4">
                    <section class="app-panel">
                        <label for="buscaConversas" class="form-label">Buscar conversa</label>
                        <input id="buscaConversas" class="form-control mb-3" type="search" placeholder="Nome ou interesse">
                        <div id="listaConversas"></div>
                    </section>
                </div>

                <div class="col-lg-8">
                    <section class="app-panel">
                        <div id="chatCabecalho" class="d-flex align-items-center gap-3 mb-4"></div>
                        <div id="chatMensagens" class="mb-4"></div>

                        <div class="app-card mb-3">
                            <span class="section-kicker">Cupido</span>
                            <p id="sugestaoCupido" class="mb-3"></p>
                            <button id="btnUsarSugestao" class="btn btn-match-outline btn-sm" type="button">Usar sugestão</button>
                            <a class="btn btn-match-outline btn-sm" href="../Eventos/Eventos.html">Sugerir evento</a>
                        </div>

                        <form id="formMensagem" class="d-flex gap-2">
                            <input id="campoMensagem" class="form-control" type="text" placeholder="Digite uma mensagem">
                            <button class="btn btn-match-primary" type="submit"><i class="bi bi-send"></i></button>
                        </form>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script src="../../assets/js/navigation.js"></script>
    <script src="../../assets/js/appData.js"></script>
    <script src="Conversas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
