<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assinatura | MatchConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/App.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-match">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html">
                    <i class="bi bi-heart-pulse-fill"></i> MatchConnect
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3 text-center">
                        <li class="nav-item"><a class="nav-link" href="../../index.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Planos/Planos.html">Planos</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Termos/Termos.html">Termos</a></li>
                        <li class="nav-item"><a href="../Login/login.html" class="btn btn-entrar">Entrar</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        <div class="container">
            <section class="page-heading">
                <div>
                    <span class="section-kicker">Plano escolhido</span>
                    <h1 id="tituloPlano">Assinatura</h1>
                    <p>Esta é uma simulação de contratação para o protótipo. O plano escolhido será salvo no navegador.</p>
                </div>
            </section>

            <div class="row g-4">
                <div class="col-lg-5">
                    <section class="app-panel">
                        <h2 class="h4 fw-bold" id="nomePlano">Plano</h2>
                        <p class="display-6 fw-bold mb-1" id="precoPlano">R$ 0</p>
                        <p class="text-muted" id="descricaoPlano"></p>
                        <div id="beneficiosPlano" class="d-flex flex-column gap-2"></div>
                    </section>
                </div>
                <div class="col-lg-7">
                    <form id="formAssinatura" class="app-panel">
                        <h2 class="h4 fw-bold mb-3">Dados para confirmação</h2>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nomeAssinante" class="form-label">Nome</label>
                                <input id="nomeAssinante" class="form-control" type="text">
                            </div>
                            <div class="col-md-6">
                                <label for="emailAssinante" class="form-label">E-mail</label>
                                <input id="emailAssinante" class="form-control" type="email">
                            </div>
                            <div class="col-md-6">
                                <label for="formaPagamento" class="form-label">Forma de pagamento</label>
                                <select id="formaPagamento" class="form-select">
                                    <option>Pix</option>
                                    <option>Cartão de crédito</option>
                                    <option>Boleto</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="cupom" class="form-label">Cupom</label>
                                <input id="cupom" class="form-control" type="text" placeholder="Opcional">
                            </div>
                        </div>
                        <button class="btn btn-match-primary mt-4" type="submit">Confirmar plano</button>
                        <p id="mensagemAssinatura" class="status-message mt-3"></p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="../../assets/js/appData.js"></script>
    <script src="Assinatura.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
